<form [formGroup]="form">
  <div class="h-screen w-screen bg-gray-800 text-white">
    <header class="w-full h-1/10 flex justify-center items-center">
      <div id="team-a" class="w-1/2 px-5 h-full flex justify-end">
        <mat-form-field>
          <mat-label>team A Match Points</mat-label>
          <input
            matInput
            type="number"
            [formControlName]="'teamAMatchPoints'"
          />
        </mat-form-field>
      </div>
      <div id="team-b" class="w-1/2 px-5 h-full flex justify-between">
        <mat-form-field>
          <mat-label>team B Match Points</mat-label>
          <input
            matInput
            type="number"
            [formControlName]="'teamBMatchPoints'"
          />
        </mat-form-field>

        <button
          class="bg-black h-12 mt-5 py-3 px-8 rounded-md cursor-pointer"
          matButton="filled"
          (click)="update()"
        >
          Update
        </button>
      </div>
    </header>

    <section class="flex w-full h-9/10">
      <div class="w-1/2 h-full flex flex-col justify-center team-a">
        <div *ngFor="let i of [0, 1, 2, 3, 4]" class="user-div">
          <mat-form-field>
            <mat-label>Player {{ i }} A Health</mat-label>
            <input
              matInput
              type="number"
              [defaultValue]="'Player ' + i"
              [formControlName]="'player' + i + 'AHealth'"
            />
          </mat-form-field>

          <mat-form-field>
            <mat-label>Player {{ i }} A Nickname</mat-label>
            <input
              matInput
              type="text"
              [defaultValue]="'Player ' + i"
              [formControlName]="'player' + i + 'ANickname'"
            />
          </mat-form-field>
        </div>
      </div>
      <div class="w-1/2 h-full flex flex-col justify-center items-end team-b">
        <div *ngFor="let i of [0, 1, 2, 3, 4]" class="user-div">
          <mat-form-field>
            <mat-label>Player {{ i }} B Health</mat-label>
            <input
              matInput
              type="number"
              [defaultValue]="100"
              [formControlName]="'player' + i + 'BHealth'"
            />
          </mat-form-field>

          <mat-form-field>
            <mat-label>Player {{ i }} B Nickname</mat-label>
            <input
              matInput
              type="text"
              [defaultValue]="100"
              [formControlName]="'player' + i + 'BNickname'"
            />
          </mat-form-field>
        </div>
      </div>
    </section>
  </div>
</form>
