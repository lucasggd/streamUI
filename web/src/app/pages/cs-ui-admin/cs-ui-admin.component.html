<div class="h-screen w-screen bg-gray-800 text-white">
  <form
    [formGroup]="form"
    class="w-full h-full flex flex-col justify-center items-center"
  >
    <mat-form-field>
      <mat-label>team A Match Points</mat-label>
      <input matInput type="number" [formControlName]="'teamAMatchPoints'" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>team B Match Points</mat-label>
      <input matInput type="number" [formControlName]="'teamBMatchPoints'" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Player 1 A Health</mat-label>
      <input matInput type="number" [formControlName]="'player1AHealth'" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Player 1 A Nickname</mat-label>
      <input matInput type="text" [formControlName]="'player1ANickname'" />
    </mat-form-field>

    <button
      class="bg-black py-3 px-8 rounded-md cursor-pointer"
      matButton="filled"
      (click)="update()"
    >
      Update
    </button>
  </form>
</div>
